# --- TERMINAL & COLORS ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- CORE BEHAVIOR ---
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# When the attached session is destroyed, switch to the most-recent remaining session
set-option -g detach-on-destroy off

# --- KEYBINDINGS ---
# Set prefix
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Vim keys to switch sessions
bind-key j switch-client -n
bind-key k switch-client -p

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Lazygit popup
bind-key G popup -E -w 95% -h 95% -d '#{pane_current_path}' lazygit

# ccmux agent picker popup
bind-key a display-popup -E -w 80% -h 75% "$HOME/Projects/ccmux/bin/ccmux"

# Set vi-mode and copy bindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- PLUGINS ---
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# yorumi theme (local, not tpm-managed — see tmux/yorumi-tmux/). Loaded after
# tpm so it isn't clobbered by anything tpm loads.
run-shell "$HOME/Projects/.dotfiles/tmux/yorumi-tmux/yorumi.tmux"

# Generic fix for message-style/message-command-style missing fill= (see the
# file for why). Theme-agnostic: sourced last so it patches in fill= based on
# whatever bg= the active theme above just set, no matter which theme it is.
run-shell "$HOME/Projects/.dotfiles/tmux/fix-message-fill.tmux"
