# Restore term color
# set-option -sa terminal-overrides ",alacritty"
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ",alacritty:RGB"

# Enable mouse globaly
set -g mouse on

# Start windowing and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# When the attached session is destroyed (e.g. a task's session quits), switch
# to the most-recent remaining session instead of detaching the client.
set-option -g detach-on-destroy off

# Set prefix 
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Vim keys to switch sessions (mirrors jmux's Ctrl-Shift-Up/Down)
bind-key j switch-client -n
bind-key k switch-client -p

# Lazygit popup
# jmux uses `prefix g` for its diff/info panel — lazygit moved to `prefix G`.
bind-key G popup -E -w 95% -h 95%  -d '#{pane_current_path}' lazygit

# ccmux agent picker popup (prefix a = agents)
# Routed to the local fork (~/Projects/ccmux). Revert to "ccmux" for Homebrew.
bind-key a display-popup -E -w 80% -h 75% "$HOME/Projects/ccmux/bin/ccmux"

# Tell TPM exactly where to install plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'vaaleyard/tmux-dotbar'

# dotbar colors: defaults are Ayu dark; only bg is pinned to match alacritty's
# ayu_dark background exactly (#0A0E14 vs dotbar's #0B0E14).
set -g @tmux-dotbar-bg "#0A0E14"
set -g @tmux-dotbar-bold-current-window true

# Icon after the window name, keyed on the running command (Nerd Font glyphs).
# Add apps by nesting another #{?#{==:#{pane_current_command},CMD}, ICON,...}.
set -g @tmux-dotbar-window-status-format " #W#{?#{==:#{pane_current_command},zsh}, #[fg=#95E6CB]󰆍#[default],#{?#{==:#{pane_current_command},hx}, #[fg=#95E6CB]󰏫#[default],#{?#{==:#{pane_current_command},claude}, #[fg=#95E6CB]󰚩#[default],}}} "

# dotbar doesn't override these tmux defaults: the default length (10) truncates
# long session names mid-cap, and the default current style is underscore.
set -g status-left-length 100
set -g window-status-current-style "none"

# Pane borders (Ayu dark): dim for inactive, ayu blue for active
set -g pane-border-style "fg=#475266"
set -g pane-active-border-style "fg=#39BAE6"

# Remaining tmux UI (Ayu dark). tmux defaults to yellow/orange for all of these.
# fill= is needed on message styles or the `:` prompt only paints its text cells.
set -g message-style "bg=#0A0E14,fg=#BFBDB6,fill=#0A0E14"
set -g message-command-style "bg=#0A0E14,fg=#39BAE6,fill=#0A0E14"
# selection/highlight in copy-mode and choose-tree (session/window picker)
set -g mode-style "bg=#253340,fg=#BFBDB6"
set -g popup-style "bg=#0A0E14,fg=#BFBDB6"
set -g popup-border-style "fg=#475266"
set -g menu-style "bg=#0A0E14,fg=#BFBDB6"
set -g menu-selected-style "bg=#253340,fg=#BFBDB6"
set -g menu-border-style "fg=#475266"
set -g display-panes-colour "#475266"
set -g display-panes-active-colour "#39BAE6"
set -g clock-mode-colour "#39BAE6"

# Set vi-mode
set-window-option -g mode-keys vi
# mod keybindings for copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
