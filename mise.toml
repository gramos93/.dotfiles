# Spike: one repo, one config for macOS and Fedora.
# Dotfiles live in this repo; per-OS differences are Tera templates (os()) or OS-guarded lines.
# Apply: mise dot apply   |   Whole machine: mise bootstrap

[dotfiles]
"~/.zshrc"                            = { source = "zsh/.zshrc" }
"~/.config/tmux/tmux.conf"            = { source = "tmux/tmux.conf" }
"~/.config/tmux/scripts"              = { source = "tmux/scripts" }
"~/.config/helix/config.toml"         = { source = "helix/config.toml.tera", mode = "template" }
"~/.config/helix/languages.toml"      = { source = "helix/languages.toml" }
"~/.config/alacritty/alacritty.toml"  = { source = "alacritty/alacritty.toml.tera", mode = "template" }
"~/.config/alacritty/themes"          = { source = "alacritty/themes" }

# Helix (steel fork): versioned Steel config linked file by file into ~/.config/helix,
# and the runtime dir linked from the fork checkout (cargo-installed hx finds no runtime otherwise).
"~/.config/helix" = { source = "helix/steel", mode = "symlink-each" }
"~/.config/helix/runtime" = { source = "~/Projects/personal/helix/runtime" }

# i3 is Linux-only: macOS skips these entries.
[dotfiles."i3/config"]
source = "i3/config"
variants = [{ os = "linux", target = "~/.config/i3/config" }]

[dotfiles."i3/scripts"]
source = "i3/scripts"
variants = [{ os = "linux", target = "~/.config/i3/scripts" }]

# CLI tools: same versions on both machines, no brew/dnf involved.
[tools]
acli = "latest"
argocd = "latest"
bats = "latest"
conftest = "latest"
deck = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
grpcurl = "latest"
helm = "latest"
jq = "latest"
kind = "latest"
lazygit = "latest"
ripgrep = "latest"
ruff = "latest"
saml2aws = "latest"
temporal = "latest"
tfswitch = "latest"
uv = "latest"
vault = "latest"
yq = "latest"
rust = "1.90.0"  # matches the helix fork's rust-toolchain.toml

# Host packages: things mise's tool registry cannot provide, plus desktop apps.
# Fedora package names marked (F) are unverified until run on Fedora 44.
[bootstrap.packages]
tmux = "latest"
btop = "latest"  # aqua's btop build is Linux-only, so it is a host package
libpq = "latest"
awscli = { names = { brew = "awscli", dnf = "awscli2" } }  # (F) dnf name

# macOS only (Fedora equivalents not yet mapped)
"brew:bash"          = { os = "macos" }
"brew:coreutils"     = { os = "macos" }
"brew:gawk"          = { os = "macos" }
"brew:fnm"           = { os = "macos" }
"brew:jadx"          = { os = "macos" }
"brew:jfrog-cli"     = { os = "macos" }
"brew:jid"           = { os = "macos" }
"brew:tre-command"   = { os = "macos" }
"brew:can1357/tap/omp" = { os = "macos" }
"brew:worktrunk"     = { os = "macos" }
"brew-cask:alacritty"  = { os = "macos" }
"brew-cask:bruno"      = { os = "macos" }
"brew-cask:caffeine"   = { os = "macos" }
"brew-cask:claude-code" = { os = "macos" }
"brew-cask:devtunnel"  = { os = "macos" }

# Both OSes
"brew-cask:font-jetbrains-mono-nerd-font" = { os = ["macos", "linux"] }

# Linux (Fedora) desktop: i3 stack, all (F)
"dnf:alacritty"            = { os = "linux" }
"dnf:i3"                   = { os = "linux" }
"dnf:i3lock"               = { os = "linux" }
"dnf:xss-lock"             = { os = "linux" }
"dnf:dex-autostart"        = { os = "linux" }
"dnf:rofi"                 = { os = "linux" }
"dnf:scrot"                = { os = "linux" }
"dnf:xclip"                = { os = "linux" }
"dnf:feh"                  = { os = "linux" }
"dnf:autorandr"            = { os = "linux" }
"dnf:xinput"               = { os = "linux" }
"dnf:pulseaudio-utils"     = { os = "linux" }
"dnf:network-manager-applet" = { os = "linux" }

# Build deps for the helix fork on Fedora (names unverified, (F))
"dnf:gcc"                  = { os = "linux" }
"dnf:gcc-c++"              = { os = "linux" }
"dnf:make"                 = { os = "linux" }
"dnf:cmake"                = { os = "linux" }
"dnf:pkgconf-pkg-config"   = { os = "linux" }
"dnf:openssl-devel"        = { os = "linux" }
"dnf:perl"                 = { os = "linux" }

# Helix steel fork (mattwparas/helix). Pinned to a commit: bump deliberately.
# Build and plugin steps are explicit tasks, not part of every bootstrap:
#   mise run helix:setup   (= helix:build then helix:plugins)
[bootstrap.repos]
"~/Projects/personal/helix" = { url = "https://github.com/mattwparas/helix.git", ref = "424add100eac9ca258d969b985a8ac370469ec05" }

[tasks."helix:build"]
description = "Build and install hx (steel+git), steel, steel-language-server and forge via cargo xtask"
dir = "~/Projects/personal/helix"
run = "cargo xtask steel"
sources = ["{{env.HOME}}/Projects/personal/helix/**/*.rs", "{{env.HOME}}/Projects/personal/helix/Cargo.lock", "{{env.HOME}}/Projects/personal/helix/rust-toolchain.toml"]
outputs = ["{{env.HOME}}/.cargo/bin/hx"]

[tasks."helix:plugins"]
description = "Install Steel plugins from helix/steel/cog.scm (native dylibs, per OS). Runs from the repo, not ~/.config/helix: forge cannot copy the runtime symlink there."
dir = "{{config_root}}/helix/steel"
depends = ["helix:build"]
run = "forge install"

[tasks."helix:setup"]
description = "Fresh-machine Helix: build the fork, then install plugins"
depends = ["helix:plugins"]

[tasks."helix:update"]
description = "Pull the latest steel-event-system, bump the pin in mise.toml, rebuild and reinstall hx, then refresh plugins"
dir = "~/Projects/personal/helix"
run = '''
set -euo pipefail
if [ -n "$(git status --porcelain)" ]; then echo "helix checkout has local changes; commit or stash first" >&2; exit 1; fi
old=$(git rev-parse HEAD)
git fetch origin steel-event-system
git checkout steel-event-system
git merge --ff-only origin/steel-event-system
new=$(git rev-parse HEAD)
if [ "$old" = "$new" ]; then echo "helix already at ${new:0:9}"; else git log --oneline "$old..$new"; fi
# keep the bootstrap pin in step with the checkout (commit the change in the dotfiles repo)
perl -pi -e "s/(mattwparas\/helix\.git\", ref = \")[0-9a-f]{40}/\${1}$new/" "$MISE_CONFIG_ROOT/mise.toml"
# same steps as helix:build and helix:plugins, without re-entering mise (build always runs)
cargo xtask steel
(cd "$MISE_CONFIG_ROOT/helix/steel" && forge install)
'''
